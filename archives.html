<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Targets – Scam Radar</title>
  <link rel="stylesheet" href="archives-style.css"> <!-- Still using same style -->
</head>
<body class="archives-background">

  <!-- UI: Loading -->
  <div id="loading" style="color:white;text-align:center;padding:20px;">Loading Targets...</div>

  <!-- Hall of Fame Container (Rebranded as Targets) -->
  <main class="hall-of-fame" id="hall-of-fame">
    <!-- Targets will be inserted here -->
  </main>

  <!-- Return Button -->
  <a href="index.html" class="back-button">← Return</a>

  <!-- Click Sound -->
  <audio id="clickSound" src="audio/click-sound.mp3" preload="auto"></audio>

  <script>
    function loadTargets() {
      const hall = document.getElementById("hall-of-fame");

      const targets = [
        {
          name: "Fake s1mple scammer",
          link: "https://www.youtube.com/watch?v=K296nne-6aM",
        }
        // You can add more scammer targets here later
      ];

      targets.forEach(target => {
        const link = document.createElement("a");
        link.href = target.link;
        link.target = "_blank";
        link.className = "vip";
        link.innerHTML = `<span class="vip-sparkles">${target.name}</span>`;
        hall.appendChild(link);
      });

      document.getElementById("loading").style.display = "none";
    }

    window.onload = loadTargets;

    // Click sound for all interactive elements
    const clickSound = document.getElementById('clickSound');
    const clickableElements = document.querySelectorAll('button, a');
    clickableElements.forEach(element => {
      element.addEventListener('click', () => {
        if (clickSound) {
          clickSound.currentTime = 0;
          clickSound.play().catch(error => console.error('Click sound play failed:', error));
        }
      });
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Targets – Scam Radar</title>
  <link rel="stylesheet" href="archives-style.css">
  <style>
    .target-entry {
      display: block;
      background-color: rgba(0, 0, 0, 0.65);
      color: white;
      text-decoration: none;
      padding: 16px;
      font-size: 20px;
      font-weight: bold;
      border: 2px solid red;
      border-radius: 10px;
      margin-bottom: 16px;
      transition: background 0.3s ease;
    }

    .target-entry:hover {
      background-color: rgba(255, 0, 0, 0.2);
    }
  </style>
</head>
<body class="archives-background">

  <!-- UI: Loading -->
  <div id="loading" style="color:white;text-align:center;padding:20px;">Loading Targets...</div>

  <!-- Target List -->
  <main class="hall-of-fame" id="hall-of-fame">
    <!-- Targets go here -->
  </main>

  <!-- Return Button -->
  <a href="index.html" class="back-button">← Return</a>

  <!-- Click Sound -->
  <audio id="clickSound" src="audio/click-sound.mp3" preload="auto"></audio>

  <script>
    function loadTargets() {
      const hall = document.getElementById("hall-of-fame");

      const targets = [
        {
          name: "Fake s1mple (scammer)",
          link: "https://www.youtube.com/watch?v=K296nne-6aM"
        },
        {
          name: "Fake Donk (scammer)",
          link: "https://www.youtube.com/watch?v=Qd1KXchCZpA"
        }
      ];

      targets.forEach(target => {
        const link = document.createElement("a");
        link.href = target.link;
        link.target = "_blank";
        link.className = "target-entry";
        link.textContent = target.name;
        hall.appendChild(link);
      });

      document.getElementById("loading").style.display = "none";
    }

    window.onload = loadTargets;

    // Click sound effect
    const clickSound = document.getElementById('clickSound');
    const clickableElements = document.querySelectorAll('a, button');
    clickableElements.forEach(element => {
      element.addEventListener('click', () => {
        if (clickSound) {
          clickSound.currentTime = 0;
          clickSound.play().catch(() => {});
        }
      });
    });
  </script>
</body>
</html>

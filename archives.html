<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Targets | mmories.org</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="targets.css" />
</head>
<body>
  <!-- Background video -->
  <video autoplay muted loop id="bgVideo">
    <source src="videos/targets-background.mp4" type="video/mp4" />
    Your browser does not support the video tag.
  </video>
  <div class="overlay"></div>

  <!-- Top banner -->
  <header class="page-header">Reporting Page</header>

  <!-- Split layout -->
  <div class="main-split">
    <!-- Left: Target List -->
    <div class="targets-section">
      <div class="section-title">Targets</div>
      <input type="text" placeholder="SEARCH" id="searchInput" />
      <div id="targetButtons"></div>
    </div>

    <!-- Right: Report Info -->
    <div class="report-section">
      <div class="section-title">Target Selected</div>
      <p class="report-instructions">
        Click a scammer to open their link and copy the report text below.
      </p>

      <div id="targetDetails">
        <p>Select a scammer from the left panel.</p>

        <div id="reportBox" style="display:none; margin-top: 2rem;">
          <h3>COPY THIS</h3>
          <p id="reportText" class="report-text">
            Click to copy report text...
          </p>
          <img id="reportButton" src="images/report1.webp" style="display:none;" class="report-img" />
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom footer -->
  <footer class="page-footer">
    Website operated by one person, manual system, thank you for understanding ♥
  </footer>

  <!-- Audio + JS -->
  <audio id="clickSound" src="click.mp3" preload="auto"></audio>
  <script src="targets.js"></script>
</body>
</html>

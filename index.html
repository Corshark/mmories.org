<html lang="en">
<head>
  <meta charset="UTF-8" />

    <!-- Loading label -->
    <p style="margin-top: 20px; font-size: 1.4em; color: #7CC133; font-family: 'Segoe UI', sans-serif; text-shadow: 0 0 8px #7CC133;">Connecting...</p>
  </div>
</div>


  <!-- MAIN CONTENT -->
  <div id="mainContent" style="display: none;">
    <!-- START original mmories content -->
    <video autoplay muted loop id="bgVideo">
      <source src="videos/your-video.mp4" type="video/mp4" />
      Your browser does not support the video tag.
    </video>

    <div class="content">
      <h1 class="title">mmories.org</h1>
      <div class="statement">
        Exposing scammers. Protecting the community. Reporting with purpose.
      </div>

      <div class="button-bar" style="display: flex; flex-direction: column; gap: 20px; max-width: 300px; margin: 0 auto;">
        <a href="archives.html">
          <button class="animated-button card1">
            <span class="text">TARGETS</span>
          </button>
        </a>

        <button class="animated-button card2" onclick="window.location.href='banned-archive.html'">
          <span class="text">BANNED</span>
        </button>

        <button class="animated-button card3" onclick="alert('This one does something later!')">
          <span class="text">SUBMIT</span>
        </button>

        <button class="animated-button card4" id="donateBtn">
          <span class="text">DONATE</span>
        </button>
      </div>
    </div>

    <div class="founders-box">
      <div class="founders-title shimmer-name">THE FOUNDERS</div>
      <div class="founder-list">
        <p><span class="glow-label">The Sanctum of Legacy</span><br />Hizaki420</p>
        <p><span class="glow-label">AethersOffline</span><br />Sirencore</p>
        <p><span class="glow-label">Citadel of Memories</span><br />Shinners13</p>
        <p><span class="glow-label">mmories.com</span><br />Ozorah</p>
        <p><span class="glow-label">Aoe.Archives of Eternals</span><br />Falconer</p>
      </div>
    </div>

    <!-- Donate and Submit Modals go here -->
    <!-- Keep your modal HTML exactly as is -->
  </div>

  <!-- Scripts (Loader + Modals) -->
  <script>
    // Show site after 3 seconds
    setTimeout(() => {
      const loader = document.getElementById("loaderWrapper");
      loader.style.display = "none";
      document.getElementById("mainContent").style.display = "block";
    }, 3000);

    // Modal Logic
    const donateModal = document.getElementById('donateModal');
    const donateBtn = document.getElementById('donateBtn');
    const closeBtn = document.getElementById('donateClose');
    const copyBtn = document.getElementById('copyWalletBtn');
    const cryptoText = document.getElementById('cryptoWallet');

    donateBtn.addEventListener('click', () => {
      donateModal.style.display = 'block';
    });

    closeBtn.addEventListener('click', () => {
      donateModal.style.display = 'none';
    });

    window.addEventListener('click', (e) => {
      if (e.target === donateModal) {
        donateModal.style.display = 'none';
      }
    });

    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(cryptoText.textContent)
        .then(() => alert('Crypto wallet address copied to clipboard!'))
        .catch(() => alert('Failed to copy. Please copy manually.'));
    });

    const submitModal = document.getElementById('submitModal');
    const submitBtn = document.querySelector('.card3');
    const submitClose = document.getElementById('submitClose');

    submitBtn.addEventListener('click', () => {
      submitModal.style.display = 'block';
    });

    submitClose.addEventListener('click', () => {
      submitModal.style.display = 'none';
    });

    window.addEventListener('click', (e) => {
      if (e.target === submitModal) {
        submitModal.style.display = 'none';
      }
    });
  </script>
</body>
</html>

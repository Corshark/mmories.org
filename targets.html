<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scam Command Center</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Inter:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <video id="bg-video" autoplay muted loop>
    <source src="glitch-background.mp4" type="video/mp4">
  </video>

  <div class="corshark-mascot">
    <img src="corshark.png" alt="Corshark Mascot" />
    <div class="bubble">"Scammers won't know what hit 'em."</div>
  </div>

  <div class="layout">
    <div class="panel left">
      <h2>Intel Briefing</h2>
      <p>Welcome agent. Your mission: identify and report scammer entities threatening the digital frontier. Stay vigilant. Trust no dupe.</p>
    </div>

<!-- Center Panel -->
 <div class="panel center">
   <h2>Target List</h2>
    <input type="text" id="searchInput" placeholder="Search targets..." />
    <div id="targetButtons" class="target-list">
     <!-- Buttons will be injected by JS -->
     </div>
   </div>


<!-- Right Panel -->
<div class="panel right" id="targetDetails">
  <h2>No Target Selected</h2>
  <p>Select a target to view the report details.</p>
  <div class="report-terminal" id="reportBox" style="display: none;">
    <pre id="reportText">Click a target to generate report...</pre>
    <img id="reportButton" src="images/report1.webp" alt="Report Button" style="display: none; cursor: pointer; width: 100px; margin-top: 10px;" />
  </div>
</div>


  <script src="script.js"></script>
</body>
</html>
